<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pemesanan Bazar Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-card:hover { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-20">

    <!-- HEADER -->
    <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-store text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Bazar SMP Ceria</h1>
                    <p class="text-xs text-blue-100">Sistem Pemesanan & Kasir Digital</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 mt-4">
        <!-- SEARCH & FILTER -->
        <div class="bg-white p-3 rounded-lg shadow-sm mb-4 space-y-2">
            <input type="text" placeholder="Cari makanan / minuman..." class="w-full px-3 py-2 border rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select class="w-full px-3 py-2 border rounded-md text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Semua Kategori</option>
                <option value="makanan">Makanan</option>
                <option value="minuman">Minuman</option>
            </select>
        </div>

        <!-- TOMBOL KERANJANG -->
        <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold mb-4 flex items-center justify-center space-x-2 shadow">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Keranjang ( 0 )</span>
        </button>

        <!-- DAFTAR PRODUK -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- PRODUK 1: CORNDOG MOZZA -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden product-card flex flex-col justify-between">
                <div>
                    <img src="https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=500" alt="Corndog mozza" class="w-full h-36 object-cover">
                    <div class="p-3">
                        <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">MAKANAN</span>
                        <h3 class="font-bold text-sm text-gray-800 mt-1">Corndog mozza</h3>
                        <p class="text-blue-600 font-extrabold text-sm mt-0.5">Rp 7.000</p>
                        <p class="text-[11px] text-gray-400">Stok: 4</p>
                    </div>
                </div>
                <div class="p-3 pt-0">
                    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-sm font-semibold flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Tambah</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
