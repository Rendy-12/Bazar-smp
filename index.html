<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pemesanan Bazar Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-card:hover { transform: translateY(-2px); transition: all 0.2s; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 pb-20">

    <!-- HEADER -->
    <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-store text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Bazar SMP Ceria</h1>
                    <p class="text-xs text-blue-100">Sistem Pemesanan & Kasir Digital</p>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 mt-4">
        <!-- TOMBOL KERANJANG -->
        <button onclick="toggleModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold mb-4 flex items-center justify-center space-x-2 shadow">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Keranjang ( <span id="cart-count">0</span> )</span>
        </button>

        <!-- DAFTAR PRODUK -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <!-- PRODUK: CORNDOG MOZZA -->
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden product-card flex flex-col justify-between">
                <div>
                    <img src="https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=500" alt="Corndog mozza" class="w-full h-36 object-cover">
                    <div class="p-3">
                        <span class="bg-blue-100 text-blue-800 text-[10px] font-bold px-2 py-0.5 rounded uppercase">MAKANAN</span>
                        <h3 class="font-bold text-sm text-gray-800 mt-1">Corndog mozza</h3>
                        <p class="text-blue-600 font-extrabold text-sm mt-0.5">Rp 7.000</p>
                        <p class="text-[11px] text-gray-400">Stok: 4</p>
                    </div>
                </div>
                <div class="p-3 pt-0">
                    <button onclick="addToCart('Corndog mozza', 7000)" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded-lg text-sm font-semibold flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Tambah</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL KERANJANG & PESAN -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl p-5 max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg">Keranjang Belanja</h2>
                <button onclick="toggleModal()" class="text-gray-500 font-bold text-xl">&times;</button>
            </div>
            
            <div id="cart-items" class="space-y-2 mb-4">
                <p class="text-sm text-gray-500 text-center">Keranjang masih kosong.</p>
            </div>

            <div class="border-t pt-3 mb-4">
                <div class="flex justify-between font-bold text-base">
                    <span>Total:</span>
                    <span id="cart-total" class="text-blue-600">Rp 0</span>
                </div>
            </div>

            <!-- FORM PEMESAN -->
            <div class="space-y-3">
                <input type="text" id="buyer-name" placeholder="Nama Pemesan / Kelas" class="w-full p-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-bold text-sm shadow">
                    Kirim Pesanan
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT SYSTEM -->
    <script>
        let cart = [];

        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty++;
            } else {
                cart.push({ name: name, price: price, qty: 1 });
            }
            updateCartUI();
            alert(name + " berhasil ditambahkan ke keranjang!");
        }

        function updateCartUI() {
            let totalQty = cart.reduce((sum, i) => sum + i.qty, 0);
            let totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-total').innerText = 'Rp ' + totalPrice.toLocaleString('id-ID');

            let cartContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="text-sm text-gray-500 text-center">Keranjang masih kosong.</p>';
            } else {
                cartContainer.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded border text-sm">
                        <div>
                            <p class="font-semibold">${item.name}</p>
                            <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <p class="font-bold text-blue-600">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</p>
                    </div>
                `).join('');
            }
        }

        function toggleModal() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function checkout() {
            let name = document.getElementById('buyer-name').value;
            if (!name) {
                alert('Tolong isi nama pemesan / kelas dulu ya!');
                return;
            }
            if (cart.length === 0) {
                alert('Keranjang kamu masih kosong!');
                return;
            }

            alert('Terima kasih ' + name + '! Pesanan kamu berhasil dibuat.');
            cart = [];
            document.getElementById('buyer-name').value = '';
            updateCartUI();
            toggleModal();
        }
    </script>
</body>
</html>
