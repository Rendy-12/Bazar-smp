<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pemesanan Bazar Sekolah SMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-card:hover { transform: translateY(-4px); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 flex flex-col justify-between">

    <!-- HEADER / NAVBAR -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-store text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Bazar SMP Ceria</h1>
                    <p class="text-xs text-blue-100">Sistem Pemesanan Digital</p>
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENT WRAPPER -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div id="viewKatalog">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <div class="flex flex-col sm:flex-row gap-2 w-full md:w-auto flex-grow max-w-lg">
                    <div class="relative w-full">
                        <input type="text" id="searchInput" oninput="renderKatalog()" placeholder="Cari makanan / minuman..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400"></i>
                    </div>
                </div>

                <button onclick="openCartModal()" class="w-full md:w-auto px-4 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg shadow flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cart-shopping"></i> Keranjang (<span id="cartCount">0</span>)
                </button>
            </div>

            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>
    </main>

    <!-- MODAL KERANJANG PEMESANAN -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 max-h-[90vh] flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="font-bold text-lg"><i class="fa-solid fa-cart-shopping text-blue-600 mr-2"></i>Keranjang Belanja</h3>
                    <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>

                <div id="cartItemsList" class="space-y-3 overflow-y-auto max-h-[40vh] pr-1"></div>
            </div>

            <div class="border-t pt-4 mt-4 space-y-3">
                <div class="flex justify-between font-bold text-base">
                    <span>Total Bayar:</span>
                    <span id="cartTotalText" class="text-blue-600">Rp 0</span>
                </div>

                <div class="space-y-2 text-xs">
                    <div>
                        <label class="block font-semibold mb-1 text-gray-700">Nama Pembeli *</label>
                        <input type="text" id="buyerName" placeholder="Contoh: Budi (Kelas 9A)" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-gray-700">Nomor Meja / Stand Tujuan *</label>
                        <input type="text" id="buyerTable" placeholder="Contoh: Meja 05 / Ambil Sendiri" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 text-gray-700">Catatan Khusus (Opsional)</label>
                        <input type="text" id="buyerNotes" placeholder="Contoh: Pedas / Saus Banyak" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                </div>

                <button onclick="submitOrder()" class="w-full py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow text-sm transition">
                    Proses Pesanan Now
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t py-4 text-center text-xs text-gray-500 mt-auto">
        <p>Aplikasi Stand Bazar Sekolah &copy; 2026</p>
    </footer>

    <script>
        // PASTE TAUTAN GOOGLE APPS SCRIPT KAMU DI DALAM TANDA PETIK DI BAWAH INI:
        const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbyqn6ovHQ_thDoNS85znB4zCeyIS5kuRCLe6QUO6CDie9IEGcrKlb8U-bbmlish4CQg/exec";

        const products = [
            { 
                id: 1, 
                nama: "Corndog mozza", 
                kategori: "Makanan", 
                harga: 7000, 
                foto: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=500" 
            }
        ];

        let cart = [];

        window.onload = function() {
            renderKatalog();
            renderCartCount();
        };

        function renderKatalog() {
            const grid = document.getElementById('productGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = "";

            const filtered = products.filter(p => p.nama.toLowerCase().includes(search));

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow border overflow-hidden flex flex-col justify-between product-card">
                        <div>
                            <img src="${p.foto}" alt="${p.nama}" class="w-full h-36 object-cover bg-gray-100">
                            <div class="p-3">
                                <span class="text-[10px] font-semibold text-blue-600 uppercase tracking-wider bg-blue-50 px-2 py-0.5 rounded">${p.kategori}</span>
                                <h3 class="font-bold text-sm text-gray-800 mt-1 line-clamp-1">${p.nama}</h3>
                                <p class="text-blue-600 font-bold text-sm mt-1">Rp ${p.harga.toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="addToCart(${p.id})" class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-1">
                                <i class="fa-solid fa-plus"></i> Tambah
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const cartItem = cart.find(c => c.id === id);
            if (cartItem) {
                cartItem.qty++;
            } else {
                cart.push({ id: product.id, nama: product.nama, harga: product.harga, qty: 1 });
            }
            renderCartCount();
        }

        function renderCartCount() {
            const count = cart.reduce((acc, curr) => acc + curr.qty, 0);
            document.getElementById('cartCount').innerText = count;
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        function renderCartItems() {
            const container = document.getElementById('cartItemsList');
            container.innerHTML = "";

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-xs text-gray-400 py-6">Keranjang Anda masih kosong.</p>`;
                document.getElementById('cartTotalText').innerText = "Rp 0";
                return;
            }

            let total = 0;
            cart.forEach(item => {
                const subtotal = item.harga * item.qty;
                total += subtotal;
                container.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg text-xs">
                        <div>
                            <p class="font-bold text-gray-800">${item.nama}</p>
                            <p class="text-gray-500">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold">-</button>
                            <span>${item.qty}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 bg-gray-200 rounded text-gray-700 font-bold">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cartTotalText').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function updateQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (!item) return;
            item.qty += change;
            if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
            renderCartCount();
            renderCartItems();
        }

        function submitOrder() {
            const name = document.getElementById('buyerName').value.trim();
            const table = document.getElementById('buyerTable').value.trim();
            const notes = document.getElementById('buyerNotes').value.trim();

            if (!name || !table) {
                alert("Harap isi nama dan nomor meja/stand tujuan!");
                return;
            }

            if (cart.length === 0) {
                alert("Keranjang belanjaan masih kosong!");
                return;
            }

            const total = cart.reduce((acc, curr) => acc + (curr.harga * curr.qty), 0);
            const orderData = {
                id: "ORD-" + Date.now().toString().slice(-5),
                waktu: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                nama: name,
                meja: table,
                items: [...cart],
                total: total,
                catatan: notes
            };

            // Kirim Otomatis ke Google Sheets
            if (SPREADSHEET_URL && SPREADSHEET_URL !== "Https://script.google.com/macros/s/AKfycbyqn6ovHQ_thDoNS85znB4zCeyIS5kuRCLe6QUO6CDie9IEGcrKlb8U-bbmlish4CQg/exec") {
                fetch(SPREADSHEET_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            }

            alert(`Pesanan Berhasil Disimpan!\nID: ${orderData.id}\nTerima kasih, ${name}!`);

            cart = [];
            renderCartCount();
            closeCartModal();
            document.getElementById('buyerName').value = "";
            document.getElementById('buyerTable').value = "";
            document.getElementById('buyerNotes').value = "";
        }
    </script>
</body>
</html>
